name: Voltronic Inverter MQTT
version: "0.1.3"
slug: voltronic_inverter
description: Monitor and control PI30-compatible Voltronic/Axpert inverters by stable device ID
url: https://github.com/peter97silva/voltronic-homeassistant-addon
init: false
startup: application
boot: auto
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
services:
  - mqtt:need
homeassistant: 2023.8.0
hassio_api: true
udev: true
full_access: true
protected: false
options:
  device_id: ""
  device_path: ""
  device_name: Voltronic Inverter
  manufacturer: Voltronic
  model: PI30 compatible
  serial: voltronic_1
  mqtt_topic: homeassistant
  poll_interval: 10
  amperage_factor: 1.0
  watt_factor: 1.0
  max_charge_current_min: 10
  max_charge_current_max: 120
  max_charge_current_step: 10
  utility_charge_current_min: 2
  utility_charge_current_max: 60
  utility_charge_current_step: 2
  allow_raw_commands: false
schema:
  device_id: str?
  device_path: str?
  device_name: str
  manufacturer: str
  model: str
  serial: str
  mqtt_topic: str
  poll_interval: int(5,3600)
  amperage_factor: float(0.01,100)
  watt_factor: float(0.01,100)
  max_charge_current_min: int(1,999)
  max_charge_current_max: int(1,999)
  max_charge_current_step: int(1,999)
  utility_charge_current_min: int(1,999)
  utility_charge_current_max: int(1,999)
  utility_charge_current_step: int(1,999)
  allow_raw_commands: bool
